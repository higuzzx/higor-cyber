<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="630" viewBox="0 0 1200 630">
  <defs>
    <pattern id="grid" width="48" height="48" patternUnits="userSpaceOnUse">
      <path d="M 48 0 L 0 0 0 48" fill="none" stroke="rgba(0,255,135,0.035)" stroke-width="1"/>
    </pattern>
    <radialGradient id="orb1" cx="15%" cy="25%" r="55%">
      <stop offset="0%" stop-color="#00ff87" stop-opacity="0.07"/>
      <stop offset="100%" stop-color="#00ff87" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="orb2" cx="85%" cy="75%" r="50%">
      <stop offset="0%" stop-color="#00bfff" stop-opacity="0.06"/>
      <stop offset="100%" stop-color="#00bfff" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="topbar" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#00ff87"/>
      <stop offset="55%" stop-color="#00bfff"/>
      <stop offset="100%" stop-color="transparent"/>
    </linearGradient>
    <linearGradient id="sidebar" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#00ff87" stop-opacity="0"/>
      <stop offset="45%" stop-color="#00bfff" stop-opacity="0.55"/>
      <stop offset="100%" stop-color="#00ff87" stop-opacity="0"/>
    </linearGradient>
    <linearGradient id="namegrad" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#e2e8f0"/>
      <stop offset="100%" stop-color="#94a3b8"/>
    </linearGradient>
  </defs>

  <!-- BG -->
  <rect width="1200" height="630" fill="#060a10"/>
  <rect width="1200" height="630" fill="url(#grid)"/>
  <rect width="1200" height="630" fill="url(#orb1)"/>
  <rect width="1200" height="630" fill="url(#orb2)"/>

  <!-- Accent lines -->
  <rect x="0" y="0" width="1200" height="3" fill="url(#topbar)"/>
  <rect x="1197" y="0" width="3" height="630" fill="url(#sidebar)"/>

  <!-- Shield icon -->
  <g transform="translate(88,148)">
    <path d="M44 3L10 15v18c0 19.5 12.8 36.5 30 41.3C57.2 69.5 70 52.5 70 33V15L44 3z"
          fill="rgba(0,255,135,0.10)" stroke="#00ff87" stroke-width="2.2" stroke-linejoin="round"/>
    <path d="M33 34l8 8 15-15" stroke="#00ff87" stroke-width="2.6"
          stroke-linecap="round" stroke-linejoin="round"/>
  </g>

  <!-- Badge -->
  <rect x="88" y="136" width="268" height="26" rx="13"
        fill="rgba(0,255,135,0.07)" stroke="rgba(0,255,135,0.22)" stroke-width="1"/>
  <circle cx="106" cy="149" r="4" fill="#00ff87"/>
  <text x="118" y="154" font-family="monospace" font-size="10.5"
        fill="#00ff87" letter-spacing="2.5">BLUE TEAM SPECIALIST</text>

  <!-- Name -->
  <text x="88" y="298" font-family="Arial, sans-serif" font-size="76"
        font-weight="700" fill="url(#namegrad)" letter-spacing="-3">Higor Rodrigues</text>

  <!-- Role -->
  <text x="88" y="348" font-family="monospace" font-size="18"
        fill="#64748b" letter-spacing="0.5">Network Infrastructure · Defensive Cybersecurity</text>

  <!-- Separator -->
  <line x1="88" y1="384" x2="640" y2="384"
        stroke="rgba(255,255,255,0.07)" stroke-width="1"/>

  <!-- Tech tags -->
  <rect x="88"  y="402" width="98"  height="24" rx="4" fill="rgba(0,255,135,0.06)" stroke="rgba(0,255,135,0.2)" stroke-width="1"/>
  <text x="137" y="418" font-family="monospace" font-size="10" fill="#00ff87" text-anchor="middle" letter-spacing="1">pfSense</text>

  <rect x="196" y="402" width="108" height="24" rx="4" fill="rgba(0,255,135,0.06)" stroke="rgba(0,255,135,0.2)" stroke-width="1"/>
  <text x="250" y="418" font-family="monospace" font-size="10" fill="#00ff87" text-anchor="middle" letter-spacing="1">Wireshark</text>

  <rect x="314" y="402" width="90"  height="24" rx="4" fill="rgba(0,191,255,0.06)" stroke="rgba(0,191,255,0.2)" stroke-width="1"/>
  <text x="359" y="418" font-family="monospace" font-size="10" fill="#00bfff" text-anchor="middle" letter-spacing="1">Docker</text>

  <rect x="414" y="402" width="90"  height="24" rx="4" fill="rgba(0,191,255,0.06)" stroke="rgba(0,191,255,0.2)" stroke-width="1"/>
  <text x="459" y="418" font-family="monospace" font-size="10" fill="#00bfff" text-anchor="middle" letter-spacing="1">Linux</text>

  <rect x="514" y="402" width="96"  height="24" rx="4" fill="rgba(0,255,135,0.06)" stroke="rgba(0,255,135,0.2)" stroke-width="1"/>
  <text x="562" y="418" font-family="monospace" font-size="10" fill="#00ff87" text-anchor="middle" letter-spacing="1">iptables</text>

  <!-- Stats panel -->
  <rect x="820" y="200" width="300" height="200" rx="16"
        fill="rgba(11,17,28,0.65)" stroke="rgba(255,255,255,0.06)" stroke-width="1"/>

  <text x="870" y="262" font-family="monospace" font-size="52"
        font-weight="700" fill="#00ff87" text-anchor="middle">2+</text>
  <text x="870" y="288" font-family="monospace" font-size="10"
        fill="#4a5568" text-anchor="middle" letter-spacing="2.5">ANOS EXP.</text>

  <line x1="970" y1="225" x2="970" y2="375"
        stroke="rgba(255,255,255,0.06)" stroke-width="1"/>

  <text x="1070" y="262" font-family="monospace" font-size="52"
        font-weight="700" fill="#00ff87" text-anchor="middle">12</text>
  <text x="1070" y="288" font-family="monospace" font-size="10"
        fill="#4a5568" text-anchor="middle" letter-spacing="2.5">CERTS</text>

  <line x1="820" y1="320" x2="1120" y2="320"
        stroke="rgba(255,255,255,0.05)" stroke-width="1"/>

  <text x="970" y="358" font-family="monospace" font-size="10"
        fill="#4a5568" text-anchor="middle" letter-spacing="1.5">DTI · Unimontes · Montes Claros</text>

  <!-- URL -->
  <text x="88" y="592" font-family="monospace" font-size="13"
        fill="#334155" letter-spacing="1">higuzzx.github.io</text>
</svg>
